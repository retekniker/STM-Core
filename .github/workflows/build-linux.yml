name: Build Linux Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          }
          [[ "$(git describe --tags --exact-match HEAD)" == "${RELEASE_TAG}" ]] || {
            echo "Checkout is not the requested release tag ${RELEASE_TAG}." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
          cache: npm

      - name: Install dependencies
        env:
          npm_config_build_from_source: "true"
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Build Linux release assets
        run: env -u GITHUB_SHA tools/buildLinuxRelease.sh "${RELEASE_TAG}"

      - name: Validate archive and smoke-test installation
        run: tools/testLinuxRelease.sh "dist/linux/STM-Core-${RELEASE_TAG#v}-linux-x64.tar.gz"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STM-Core-Linux-x64
          path: |
            dist/linux/STM-Core-*-linux-x64.tar.gz
            dist/linux/STM-Core-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --title "STM Core ${RELEASE_TAG}" \
              --generate-notes || gh release view "${RELEASE_TAG}" >/dev/null
          fi
          gh release upload "${RELEASE_TAG}" \
            dist/linux/STM-Core-*-linux-x64.tar.gz \
            dist/linux/STM-Core-*-linux-x64.tar.gz.sha256 \
            --clobber
