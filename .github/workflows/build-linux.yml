name: Build Linux Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        shell: bash
        run: |
          [[ "${GITHUB_REF_TYPE}" == "tag" ]] || {
            echo "This workflow builds release assets only for a tag." >&2
            exit 1
          }
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must match vX.Y.Z." >&2
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Keep production dependencies only
        run: npm prune --omit=dev

      - name: Build Linux release assets
        run: tools/buildLinuxRelease.sh "${GITHUB_REF_NAME}"

      - name: Validate archive and smoke-test installation
        run: tools/testLinuxRelease.sh "dist/linux/STM-Core-${GITHUB_REF_NAME#v}-linux-x64.tar.gz"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: STM-Core-Linux-x64
          path: |
            dist/linux/STM-Core-*-linux-x64.tar.gz
            dist/linux/STM-Core-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

      - name: Attach assets to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "STM Core ${GITHUB_REF_NAME}" \
              --generate-notes || gh release view "${GITHUB_REF_NAME}" >/dev/null
          fi
          gh release upload "${GITHUB_REF_NAME}" \
            dist/linux/STM-Core-*-linux-x64.tar.gz \
            dist/linux/STM-Core-*-linux-x64.tar.gz.sha256 \
            --clobber
