<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0b0f14">
    <title>STM Core  Offline</title>
    <style>
        :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
        body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0b0f14; color: #c9ffe9; }
        main { width: min(520px, 100%); border: 2px solid #00ff9c; padding: 24px; box-sizing: border-box; box-shadow: 0 0 24px rgba(0,255,156,.25); }
        h1 { margin-top: 0; color: #00ff9c; font-size: 1.35rem; }
        p { line-height: 1.6; }
        button { min-height: 44px; padding: 0 18px; border: 1px solid #00ff9c; background: rgba(0,255,156,.1); color: #00ff9c; font: 800 0.85rem inherit; }
    </style>
</head>
<body>
    <main>
        <h1>STM CORE IS OFFLINE</h1>
        <p>Live server status and telemetry require a connection to the STM Core host. No cached telemetry is shown as current data.</p>
        <button type="button" onclick="location.reload()">TRY AGAIN</button>
    </main>
</body>
</html>
